<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image" href="registration logo (1).png">
      <!-- Bootstrap links -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- css link -->
     <link rel="stylesheet" href="RegistrationForm.css">
    <title>Registration Form</title>
</head>
<body> 
    <!-- main div jema 2 div aavese left and right  -->
<div class="register-container">
    <div class="row g-0">
            <!-- 1st Div: Left Side Image vado part  -->
            <div class="col-lg-3 d-none d-lg-block img-side">
                <!-- Ahiya image background ma cover thase -->
                
            </div>

           <!-- 2nd div: jema form aavse right side -->
            <div class="col-lg-9 form-side p-5">
                <img src="/Logo Icons (3).png" alt="Logo" class="rounded-pill d-block mx-auto mb-2">
                <h3 class="form-title text-center fw-bold mb-4">Registration Form</h3>
                <form action="">
                    <!-- Row 1: First Name & Last Name -->
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">First Name</label>
                            <input type="text" class="form-control" placeholder="Enter first name" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Last Name</label>
                            <input type="text" class="form-control" placeholder="Enter last name" required>
                        </div>
                    </div>
                    <!-- Row 2: Email & Phone No -->
                    <div class="row g-3 mb-3">
                        <div class="col-md-6 ">
                            <label class="form-label fw-bold">Email</label>
                            <input type="email" class="form-control" placeholder="name@example.com" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Phone No.</label>
                            <input type="tel" class="form-control" placeholder="Enter phone number" required>
                        </div>
                    </div>
                    <!-- Row 3: Age, Height, Gender -->
                    <div class="row g-3 mb-3">
                        <div class="col-md-4">
                            <label class="form-label fw-bold">Age</label>
                            <input type="number" class="form-control" placeholder="Age" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold">Height (cm)</label>
                            <input type="number" class="form-control" placeholder="Height in cm" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold">Gender</label>
                            <select class="form-select" required>
                                <option value="" selected disabled>Select</option>
                                <option value="male">Male</option>
                                <option value="female">Female</option>
                                <option value="other">Other</option>
                            </select>
                        </div>
                    </div>
                    <!-- Row 4: Current Weight & Target Weight -->
                    <div class="row g-3 mb-3 ">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Current Weight (kg)</label>
                            <input type="number" class="form-control" placeholder="k.g. 70" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Target Weight (kg)</label>
                            <input type="number" class="form-control" placeholder="k.g. 60" required>
                        </div>
                    </div>
                    <!-- Row 5: Dietary Preferences -->
                    <div class="mb-3">
                        <label class="form-label fw-bold">Dietary Preferences</label>
                        <select class="form-select" required>
                            <option value="" selected disabled>Choose your diet</option>
                            <option value="veg">Vegetarian</option>
                            <option value="non-veg">Non-Vegetarian</option>
                            <option value="vegan">Vegan</option>
                            <option value="jain">Jain</option>
                        </select>
                    </div>
                    <!-- Row 6: Primary Wellness Goal -->
                    <div class="mb-4">
                        <label class="form-label fw-bold">Primary Wellness Goal</label>
                        <select class="form-select" required>
                            <option value="" selected disabled>Choose your goal</option>
                            <option value="weight-loss">Weight Loss</option>
                            <option value="muscle-gain">Muscle Gain</option>
                            <option value="maintain-weight">Maintain Weight / Stay Fit</option>
                            <option value="healthy-diet">Healthy Lifestyle</option>
                        </select>
                    </div>
                    <!-- Submit Button -->
                    <button type="submit" class="btn submit-btn w-100 mb-3">Submit</button>
                    <a href="/MealPlaner.html" class="btn home-btn w-100">Back To Home</a>
                 </form>
            </div>
</div>
        
           
</body>
</html>

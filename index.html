<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image" href="login icon (2).png">
     
     <!-- Bootstrap links -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- css link -->
     <link rel="stylesheet" href="index.css">
    <title>Login-Mealplaner</title>
 
</head>
<body>
    <div class="login-card text-center">
        <!-- logo  -->
        <img src="Logo Icons (3).png" alt="company logo" class="rounded-pill mb-3">
        <h3 class="fw-bold">Wel-Come to Prep Meal Matrix</h3>
        <p class="small mb-4">Please login to access Prep Meal Matrix</p>

        <!-- form banava mate and Action attribute -->
         <form action="MealPlaner.html" method="get">
            <div class="mb-3 text-start">
                <label class="form-label small fw-bold">Email Address</label>
                <div class="input-group">
                    <span class="input-group-text">
                        <i class="bi bi-envelope"></i>
                    </span>
                    <input class="form-control" type="email" placeholder="Enter your email" required>
                </div>
            </div>
            <div class="mb-3 text-start">
                <label class="form-label small fw-bold">Password</label>
                <div class="input-group">
                    <span class="input-group-text">
                        <i class="bi bi-lock"></i>
                    </span>
                    <input class="form-control" type="password" placeholder=".......... Password" required>
                </div>
            </div>
            <!-- submit button je click karva thi website open thase -->
            <button type="submit" class="btn login-btn w-100  rounded-pill mt-3">Login to Prep Meal Matrix</button>
         </form>
    </div>
</body>
</html>
